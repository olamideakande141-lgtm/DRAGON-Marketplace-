<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRAGON Watch Ads</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src='//libtl.com/sdk.js' data-zone='12353542' data-sdk='show_12353542'></script>
<style>
  body { font-family: system-ui, sans-serif; background: #111827; color: #f9fafb; margin: 0; padding: 20px; text-align: center; }
  h1 { font-size: 22px; }
  .card { background: #1f2937; border-radius: 14px; padding: 18px; margin: 16px 0; }
  button { background: #2563eb; color: #fff; border: none; border-radius: 10px; padding: 14px 20px; font-size: 16px; width: 100%; }
  button:disabled { background: #4b5563; }
  .status { min-height: 48px; margin-top: 14px; line-height: 1.4; }
  .test { color: #fbbf24; font-weight: bold; min-height: 20px; }
</style>
</head>
<body>
<h1>🐉 Watch Ads</h1>
<div class="card">
  <p>Reward: <b id="reward">100</b> DRAGON per completed ad</p>
  <p id="mode" class="test"></p>
  <button id="watch">▶ Watch Advertisement</button>
  <div id="status" class="status"></div>
</div>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const statusEl = document.getElementById("status");
const watchBtn = document.getElementById("watch");
let busy = false;

function setStatus(text) { statusEl.textContent = text; }

async function loadMe() {
  try {
    const res = await fetch("/api/me", {
      headers: { "X-Telegram-Init-Data": tg ? tg.initData : "" }
    });
    const data = await res.json();
    if (!res.ok) { setStatus(data.error || "Could not load your account."); return; }
    document.getElementById("reward").textContent = data.adReward;
    document.getElementById("mode").textContent =
      data.testMode ? "TEST MODE: no spendable DRAGON is paid." : "";
  } catch (e) {
    setStatus("Connection error. Please try again.");
  }
}

async function reportCompletion(sessionId) {
  const res = await fetch("/api/ad/complete", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-Telegram-Init-Data": tg ? tg.initData : ""
    },
    body: JSON.stringify({ sessionId })
  });
  return res.json();
}

watchBtn.addEventListener("click", async () => {
  if (busy) return;
  busy = true;
  watchBtn.disabled = true;
  setStatus("⏳ Loading advertisement...");

  const sessionId = crypto.randomUUID();

  try {
    await show_12353542();
    setStatus("Ad finished. Checking your reward...");
    const data = await reportCompletion(sessionId);
    setStatus(data.error ? "❌ " + data.error : "✅ " + data.message);
  } catch (e) {
    setStatus("Advertisement unavailable or not completed. Please try again later.");
  } finally {
    busy = false;
    watchBtn.disabled = false;
  }
});

loadMe();
</script>
</body>
</html>
